name: darkchess
description: DarkChess - offline chess with Stockfish, move analysis and Supabase multiplayer.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.0.0
  stockfish: ^1.6.0
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/pieces/alpha/
    - assets/pieces/anarcandy/
    - assets/pieces/caliente/
    - assets/pieces/california/
    - assets/pieces/cardinal/
    - assets/pieces/cburnett/
    - assets/pieces/celtic/
    - assets/pieces/chess7/
    - assets/pieces/chessnut/
    - assets/pieces/companion/
    - assets/pieces/cooke/
    - assets/pieces/dubrovny/
    - assets/pieces/fantasy/
    - assets/pieces/firi/
    - assets/pieces/fresca/
    - assets/pieces/gioco/
    - assets/pieces/governor/
    - assets/pieces/horsey/
    - assets/pieces/icpieces/
    - assets/pieces/merida/
    - assets/pieces/pixel/
    - assets/pieces/spatial/
    - assets/pieces/staunty/
