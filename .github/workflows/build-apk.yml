name: Build DarkChess APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkchess-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Flutter must be available before generating the Android/Gradle wrapper.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Flutter project root
        run: |
          test -f pubspec.yaml || { echo 'ERROR: pubspec.yaml must be in the repository root.'; exit 1; }
          test -d lib || { echo 'ERROR: lib/ directory is missing.'; exit 1; }
          test -f lib/main.dart || { echo 'ERROR: lib/main.dart is missing.'; exit 1; }

      - name: Generate Android Gradle project when missing
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo 'Android Gradle wrapper is missing or incomplete; regenerating Android platform files.'
            rm -rf android
            flutter create --platforms=android --org com.darkroot --project-name darkchess .
          fi
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          chmod +x android/gradlew

      # Set up Java only after Gradle files exist, so setup-java's Gradle cache
      # can find gradle-wrapper.properties and does not emit the cache warning.
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Show build tool versions
        run: |
          flutter --version
          java -version
          ./android/gradlew -p android --version

      - name: Configure Android app
        run: python3 tools/patch_android.py .

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            mkdir -p android/app
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            test -s android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
            echo 'Release signing configured.'
          else
            echo 'Signing secrets are incomplete; using debug signing for this test build.'
          fi

      - name: Resolve Flutter dependencies
        run: flutter pub get

      # The stockfish 1.8.1 Android Gradle file still calls jcenter().
      # Gradle 9 no longer provides that repository helper, so replace it
      # in the downloaded package cache before Gradle configures the plugin.
      - name: Patch legacy Stockfish Android repository
        shell: bash
        run: |
          set -euo pipefail
          STOCKFISH_GRADLE="$(find "$HOME/.pub-cache/hosted/pub.dev" -type f -path '*/stockfish-*/android/build.gradle' -print -quit)"
          if [[ -n "$STOCKFISH_GRADLE" ]]; then
            sed -i 's/jcenter()/mavenCentral()/g' "$STOCKFISH_GRADLE"
            echo "Patched legacy jcenter() in: $STOCKFISH_GRADLE"
          else
            echo "Stockfish Android Gradle file not found in pub cache."
            exit 1
          fi

      - name: Analyze Dart sources
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build split APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkChess-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
